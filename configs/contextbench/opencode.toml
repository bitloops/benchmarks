# Field reference: docs/run-contextbench.md
# OpenCode + Ollama (local daemon): same model wiring as configs/swebench/opencode_ollama.toml
preset = "opencode_contextbench"

[run]
dataset_path = "datasets/contextbench_verified.train.jsonl"
include_repos = []
include_instance_ids = []
max_instances = 1
attempts = 1
max_workers = 1
timeout_seconds = 1200
workspace_timeout_seconds = 1800

[model]
# OpenCode runs with Ollama as a custom provider overlay.
# Local daemon settings come from configs/opencode/ollama.json.
provider = "ollama"
name = "glm-5.1:cloud"

[model_map.opencode]
"glm-5.1:cloud" = "ollama/glm-5.1:cloud"

[evaluation]
contextbench_repo = "third_party/ContextBench"
contextbench_cache_dir = "third_party/ContextBench/repos"
max_workers = 2
timeout_seconds = 7200

[modes.baseline.agent]
extra_args = []

[modes.with_bitloops.agent]
extra_args = ["--bitloops-init", "--bitloops-embeddings-runtime", "platform", "--bitloops-summary-mode", "auto"]
